apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: jyothsnav/my-app:2580631a5f03ea053632c4787656c7572ac74a66
        ports:
        - containerPort: 3000

