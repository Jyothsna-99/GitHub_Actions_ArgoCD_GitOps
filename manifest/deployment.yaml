apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: jyothsnav/my-app:2903fe5b36bba1dfe9be824903d1f7e308e99a60
        ports:
        - containerPort: 3000

